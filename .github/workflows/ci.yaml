name: Continuous integration

on:
    push:
        branches:
            - main
        paths-ignore:
            - "**/README.md"
    pull_request:

jobs:
    check:
        name: Check, test and lint
        runs-on: ubuntu-latest
        env:
            # Reuse build output and the cargo registry across the steps below,
            # so the workspace is only compiled once per job.
            RUN: >-
                docker run --rm
                -v renovatio-target:/app/target
                -v renovatio-registry:/usr/local/cargo/registry
                renovatio-ci
        steps:
            - uses: actions/checkout@v7

            # The image provides the GTK4 and libadwaita development libraries.
            - name: Build image
              run: docker build -t renovatio-ci .

            - name: Check
              run: $RUN cargo check --workspace --all-targets

            - name: Test
              run: $RUN cargo test --workspace

            - name: Clippy
              run: $RUN cargo clippy --workspace --all-targets -- -D warnings

    fmt:
        name: Rustfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - run: cargo fmt --all -- --check
